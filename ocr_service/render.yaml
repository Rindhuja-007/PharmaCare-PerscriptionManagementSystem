services:
  - type: web
    name: pharmacare-rapidocr
    runtime: python
    plan: free
    rootDir: ocr_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RAPID_OCR_TOKEN
        generateValue: true
